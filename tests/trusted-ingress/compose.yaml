name: leptos-wasi-trusted-ingress

services:
  ingress:
    build: .
    ports:
      - "127.0.0.1::8080"
    networks:
      - public
      - private
  terminal:
    image: ghcr.io/bytecodealliance/wasmtime:v46.0.1
    expose:
      - "8081"
    networks:
      - private

networks:
  public: {}
  private:
    internal: true
