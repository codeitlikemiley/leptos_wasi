[package]
name = "leptos-wasi-trusted-ingress"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.0"
publish = false

[dependencies]
anyhow = "1.0"
bytes = "1.12"
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.10", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server-auto", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
wasi-http-metadata = { git = "https://github.com/codeitlikemiley/wasi-http-middleware", rev = "3df96c21a7906b885e67229e9a7c8c01b6497109", version = "=0.2.0-alpha.3" }
wasi-http-policy-core = { git = "https://github.com/codeitlikemiley/wasi-http-middleware", rev = "3df96c21a7906b885e67229e9a7c8c01b6497109", version = "=0.2.0-alpha.3" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
