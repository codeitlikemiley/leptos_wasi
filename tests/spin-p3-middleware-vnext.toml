spin_manifest_version = 2

[application]
name = "test-app-p3-middleware-vnext"
version = "0.0.0"

[[trigger.http]]
route = "/..."
component = "test-app-p3"
executor = { type = "http" }
dependencies.middleware = [{ component = "middleware-fixture" }]

[component.test-app-p3]
source = "test-app-p3.wasm"
files = [{ source = "test-app/static", destination = "/static" }]

[component.middleware-fixture]
source = "middleware-fixture.wasm"
