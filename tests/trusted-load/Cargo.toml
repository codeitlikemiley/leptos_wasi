[package]
name = "leptos-wasi-trusted-load"
version = "0.0.0"
edition = "2024"
rust-version = "1.93.0"
publish = false

[dependencies]
anyhow = "1.0.103"
bytes = "1.12.1"
hdrhistogram = "7.5.4"
http = "1.4.1"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9.11"

[profile.release]
lto = "thin"
codegen-units = 1
