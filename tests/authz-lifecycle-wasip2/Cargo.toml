[package]
name = "leptos-wasi-authz-wasip2-lifecycle"
description = "Real-host WASIp2 authorization and WaitPoll lifecycle fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos_wasi = { package = "leptos-wasi-runtime", path = "../..", default-features = false, features = ["wasip2"] }
thiserror = "2.0"
wasi = "=0.14.7"
wasi-authz-client = { path = "../../../wasi-auth/crates/wasi-authz-client", version = "=0.1.0-rc.3", default-features = false, features = ["wasip2"] }
wasi-authz-contract = { path = "../../../wasi-auth/crates/wasi-authz-contract", version = "=0.1.0-rc.3" }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
