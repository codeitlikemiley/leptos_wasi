[package]
name = "leptos-wasi-identity-boundary"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.94.0"
description = "Proves the portable middleware context and the HMAC trusted context are not interchangeable."

[dev-dependencies]
http = "1"
wasi-auth = { git = "https://github.com/codeitlikemiley/wasi-auth", rev = "bdfad80372287a3be4215aeefad534098ef6537b", version = "=0.1.0-rc.5", default-features = false, features = ["http"] }
wasi-http-authn = { git = "https://github.com/codeitlikemiley/wasi-http-middleware", rev = "3df96c21a7906b885e67229e9a7c8c01b6497109", version = "=0.2.0-alpha.3" }
wasi-http-metadata = { git = "https://github.com/codeitlikemiley/wasi-http-middleware", rev = "3df96c21a7906b885e67229e9a7c8c01b6497109", version = "=0.2.0-alpha.3" }
