[package]
name = "leptos-wasi-authz-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.93.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
axum-core = "0.5.6"
bytes = "1.12.1"
futures = "0.3.31"
http = "1.4.1"
http-body-util = "0.1.3"
leptos = { version = "0.8.20", default-features = false, features = ["islands", "ssr"] }
leptos-wasi-authz = { path = "../../../wasi-auth/crates/leptos-wasi-authz", version = "=0.1.0-alpha.4" }
leptos_meta = { version = "0.8.6", default-features = false, features = ["ssr"] }
leptos_router = { version = "0.8.14", default-features = false, features = ["ssr"] }
leptos_wasi = { path = "../..", default-features = false, features = ["wasip3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
server_fn = { version = "0.8.12", default-features = false, features = ["axum-no-default"] }
thiserror = "2"
wasi-authz-client = { path = "../../../wasi-auth/crates/wasi-authz-client", version = "=0.1.0-alpha.4", features = ["wasip3"] }
wasi-authz-cedar = { path = "../../../wasi-auth/crates/wasi-authz-cedar", version = "=0.1.0-alpha.4" }
wasi-authz-contract = { path = "../../../wasi-auth/crates/wasi-authz-contract", version = "=0.1.0-alpha.4" }
wasi-authz-spicedb = { path = "../../../wasi-auth/crates/wasi-authz-spicedb", version = "=0.1.0-alpha.4" }
wasi-http-authn = { path = "../../../wasi-auth/legacy/wasi-http-middleware/crates/authn", version = "=0.2.0-alpha.3" }
wasip3 = { version = "=0.7.0", features = ["http-compat"] }

[features]
default = ["ssr"]
ssr = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
