[package]
name = "leptos-wasi-authz-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
axum-core = "0.5.6"
bytes = "1.12.1"
futures = "0.3.31"
http = "1.4.1"
http-body-util = "0.1.3"
leptos = { version = "0.8.22", default-features = false, features = ["islands", "ssr"] }
leptos-wasi-authz = { git = "https://github.com/codeitlikemiley/wasi-auth", rev = "bdfad80372287a3be4215aeefad534098ef6537b", version = "=0.1.0-rc.5" }
leptos_meta = { version = "0.8.6", default-features = false, features = ["ssr"] }
leptos_router = { version = "0.8.14", default-features = false, features = ["ssr"] }
leptos_wasi = { package = "leptos-wasi-runtime", path = "../..", default-features = false, features = ["wasip3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
server_fn = { version = "0.8.13", default-features = false, features = ["axum-no-default"] }
thiserror = "2"
wasi-authz-client = { git = "https://github.com/codeitlikemiley/wasi-auth", rev = "bdfad80372287a3be4215aeefad534098ef6537b", version = "=0.1.0-rc.5", features = ["wasip3"] }
wasi-authz-cedar = { git = "https://github.com/codeitlikemiley/wasi-auth", rev = "bdfad80372287a3be4215aeefad534098ef6537b", version = "=0.1.0-rc.5" }
wasi-authz-contract = { git = "https://github.com/codeitlikemiley/wasi-auth", rev = "bdfad80372287a3be4215aeefad534098ef6537b", version = "=0.1.0-rc.5" }
wasi-authz-spicedb = { git = "https://github.com/codeitlikemiley/wasi-auth", rev = "bdfad80372287a3be4215aeefad534098ef6537b", version = "=0.1.0-rc.5" }
wasi-http-authn = { path = "../../../wasi-http-middleware/crates/authn", version = "=0.2.0-alpha.3" }
wasip3 = { version = "=0.9.0", features = ["http-compat"] }

[features]
default = ["ssr"]
ssr = []

# `wasi-auth` bdfad803 still git-depends on middleware 896f8f54. The path
# patch is wasi-http-middleware 3df96c21 (PR 1), checked out beside this repo.
[patch."https://github.com/codeitlikemiley/wasi-http-middleware"]
wasi-http-metadata = { path = "../../../wasi-http-middleware/crates/metadata" }
wasi-http-authn = { path = "../../../wasi-http-middleware/crates/authn" }
wasi-http-policy-core = { path = "../../../wasi-http-middleware/crates/policy-core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
