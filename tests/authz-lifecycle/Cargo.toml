[workspace]
members = ["downstream-probe", "fault-pdp"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
http = "1.4"
http-body-util = "0.1"
serde_json = "1.0"
wasip3 = { version = "=0.7.1", features = ["http-compat"] }
wasi-http-middleware-component-support = { path = "../../../wasi-auth/legacy/wasi-http-middleware/crates/component-support" }
wit-bindgen = { version = "=0.59.0", features = ["async-spawn"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
