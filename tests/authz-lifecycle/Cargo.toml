[workspace]
members = ["downstream-probe", "fault-pdp"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
http = "1.4"
http-body-util = "0.1"
serde_json = "1.0"
wasip3 = { version = "=0.9.0", features = ["http-compat"] }
wasi-http-middleware-component-support = { git = "https://github.com/codeitlikemiley/wasi-http-middleware", rev = "3df96c21a7906b885e67229e9a7c8c01b6497109", version = "=0.2.0-alpha.3" }
wit-bindgen = { version = "=0.62.0", features = ["async-spawn"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
