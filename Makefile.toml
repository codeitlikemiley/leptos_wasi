[config]
default_to_workspace = false

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.clippy-wasip2]
command = "cargo"
args = [
    "clippy",
    "--locked",
    "--all-targets",
    "--no-default-features",
    "--features",
    "wasip2,islands-router",
    "--",
    "-D",
    "warnings",
]

[tasks.clippy-wasip3]
command = "cargo"
args = [
    "clippy",
    "--locked",
    "--all-targets",
    "--no-default-features",
    "--features",
    "wasip3,islands-router",
    "--",
    "-D",
    "warnings",
]

[tasks.clippy-dual]
command = "cargo"
args = [
    "clippy",
    "--locked",
    "--all-targets",
    "--no-default-features",
    "--features",
    "wasip2,wasip3,islands-router",
    "--",
    "-D",
    "warnings",
]

[tasks.test-wasip2]
command = "cargo"
args = [
    "test",
    "--locked",
    "--no-default-features",
    "--features",
    "wasip2,islands-router",
]

[tasks.test-wasip3]
command = "cargo"
args = [
    "test",
    "--locked",
    "--no-default-features",
    "--features",
    "wasip3,islands-router",
]

[tasks.test-dual]
command = "cargo"
args = [
    "test",
    "--locked",
    "--no-default-features",
    "--features",
    "wasip2,wasip3,islands-router",
]

[tasks.doc-wasip2]
env = { RUSTDOCFLAGS = "-Dmissing-docs -Drustdoc::broken-intra-doc-links" }
command = "cargo"
args = [
    "doc",
    "--locked",
    "--no-deps",
    "--no-default-features",
    "--features",
    "wasip2,islands-router",
]

[tasks.doc-wasip3]
env = { RUSTDOCFLAGS = "-Dmissing-docs -Drustdoc::broken-intra-doc-links" }
command = "cargo"
args = [
    "doc",
    "--locked",
    "--no-deps",
    "--no-default-features",
    "--features",
    "wasip3,islands-router",
]

[tasks.doc-dual]
env = { RUSTDOCFLAGS = "-Dmissing-docs -Drustdoc::broken-intra-doc-links" }
command = "cargo"
args = [
    "doc",
    "--locked",
    "--no-deps",
    "--no-default-features",
    "--features",
    "wasip2,wasip3,islands-router",
]

[tasks.clippy-all-features]
command = "cargo"
args = ["clippy", "--locked", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.test-all-features]
command = "cargo"
args = ["test", "--locked", "--all-features"]

[tasks.doc-all-features]
env = { RUSTDOCFLAGS = "-Dmissing-docs -Drustdoc::broken-intra-doc-links" }
command = "cargo"
args = ["doc", "--locked", "--no-deps", "--all-features"]

[tasks.ci-wasip2]
dependencies = ["fmt", "clippy-wasip2", "test-wasip2", "doc-wasip2"]

[tasks.ci-wasip3]
dependencies = ["fmt", "clippy-wasip3", "test-wasip3", "doc-wasip3"]

[tasks.ci-dual]
dependencies = [
    "fmt",
    "clippy-dual",
    "test-dual",
    "doc-dual",
    "clippy-all-features",
    "test-all-features",
    "doc-all-features",
]

[tasks.api-fixtures]
script_runner = "@shell"
script = [
    "cargo check --locked --manifest-path tests/api-fixtures/wasip2-consumer/Cargo.toml",
    "cargo check --locked --manifest-path tests/api-fixtures/wasip3-consumer/Cargo.toml",
    "cargo check --locked --manifest-path tests/api-fixtures/dual-runtime-consumer/Cargo.toml",
]

# Must mirror the middleware-contract CI job's invocation. Without
# --composition-tools this task passed on changes CI rejected, which is the
# worst thing a "run before you push" task can do.
[tasks.middleware-manifest-audit]
command = "./scripts/audit-middleware-manifests.py"
args = ["--composition-tools"]

[tasks.middleware-vnext]
command = "./scripts/run-middleware-tests.sh"

[tasks.ci]
dependencies = ["ci-wasip2", "ci-wasip3", "ci-dual", "api-fixtures"]

# Deliberately not a dependency of [tasks.ci]. The soak job's own notes record
# a +/-0.7pp measurement problem on shared runners over a 600-second load
# test; a microsecond-scale sample stands no chance there. Run this by hand
# when bumping leptos, which is the regression this covers.
[tasks.bench]
command = "cargo"
args = [
    "bench",
    "--locked",
    "--no-default-features",
    "--features",
    "wasip2,islands-router",
]

[tasks.package]
command = "cargo"
args = ["package", "--locked"]

# Local mirror of the CI package job, which invokes the same two cargo
# commands directly rather than installing cargo-make for them.
[tasks.release-check]
dependencies = ["package", "publish-dry-run"]

[tasks.publish-dry-run]
command = "cargo"
args = ["publish", "--dry-run", "--locked"]
