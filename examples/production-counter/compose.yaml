services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: counter
      POSTGRES_USER: counter
      POSTGRES_PASSWORD: counter
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter -d counter"]
      interval: 1s
      timeout: 2s
      retries: 30
    volumes:
      - counter-postgres:/var/lib/postgresql/data

volumes:
  counter-postgres:
