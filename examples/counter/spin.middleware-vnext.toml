spin_manifest_version = 2

[application]
name = "counter-middleware-vnext"
version = "0.0.0"
authors = ["Uriah Galang <codeitlikemiley@gmail.com>"]
description = "Experimental WASIp3 middleware composition around the Leptos counter"

[[trigger.http]]
route = "/..."
component = "counter"
executor = { type = "http" }
dependencies.middleware = [
  { component = "request-id" },
  { component = "security-headers" },
  { component = "cors", inherit_configuration = ["environment"] },
  { component = "authn-policy", inherit_configuration = ["environment", "allowed_outbound_hosts"] },
]

[component.counter]
source = "target/wasm32-wasip2/release/counter.wasm"
allowed_outbound_hosts = ["http://127.0.0.1:3112"]
files = [
  { source = "target/site", destination = "/site" }
]

[component.counter.environment]
LEPTOS_OUTPUT_NAME = "counter"
LEPTOS_SITE_ROOT = "/site"
LEPTOS_SITE_PKG_DIR = "pkg"
WASI_MIDDLEWARE_CORS_ORIGINS = "http://127.0.0.1:3110,http://127.0.0.1:3111"
WASI_MIDDLEWARE_CORS_METHODS = "GET,HEAD,POST"
WASI_MIDDLEWARE_CORS_HEADERS = "content-type,authorization,x-request-id"
WASI_MIDDLEWARE_CORS_ALLOW_CREDENTIALS = "false"
WASI_MIDDLEWARE_AUTHN_BROKER_URL = "http://127.0.0.1:3112/authenticate"
WASI_MIDDLEWARE_AUTHN_TIMEOUT_MS = "2000"
WASI_MIDDLEWARE_AUTHN_MODE = "optional"
WASI_MIDDLEWARE_SERVICE_ID = "leptos-wasi-counter"
WASI_MIDDLEWARE_AUTHN_AUDIENCES = "api://leptos-wasi-counter"
WASI_MIDDLEWARE_AUTHN_MAX_IN_FLIGHT = "64"
WASI_MIDDLEWARE_AUTHN_ALLOW_INSECURE_LOOPBACK = "true"

[component.counter.build]
command = "cargo leptos build --release --split --frontend-only --lib-cargo-args=--locked && LEPTOS_OUTPUT_NAME=counter cargo build --locked --lib --target wasm32-wasip2 --release --no-default-features --features ssr"
watch = ["src/**/*.rs", "Cargo.toml"]

# Split browser assets intentionally remain public. This trigger has no auth
# middleware and is not wrapped by the Leptos service's middleware stack.
[[trigger.http]]
route = "/pkg/..."
component = "counter-pkg"

[component.counter-pkg]
source = { url = "https://github.com/fermyon/spin-fileserver/releases/download/v0.1.0/spin_static_fs.wasm", digest = "sha256:96c76d9af86420b39eb6cd7be5550e3cb5d4cc4de572ce0fd1f6a29471536cb4" }
files = [{ source = "target/site/pkg", destination = "/" }]
environment = { CACHE_CONTROL = "no-cache" }

[component.request-id]
source = "../../tests/middleware-artifacts/request-id.wasm"

[component.security-headers]
source = "../../tests/middleware-artifacts/security-headers.wasm"

[component.cors]
source = "../../tests/middleware-artifacts/cors.wasm"

[component.authn-policy]
source = "../../tests/middleware-artifacts/authn-policy.wasm"
