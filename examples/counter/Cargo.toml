[package]
name = "counter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
authors = ["codeitlikemiley <codeitlikemiley@gmail.com>"]
description = "A Leptos application running as a WASIp3 Component"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
leptos = { version = "0.8.20", default-features = false }
leptos_meta = { version = "0.8.6", default-features = false }
leptos_router = { version = "0.8.14", default-features = false }
leptos_wasi = { path = "../..", default-features = false, features = ["wasip3"], optional = true }
server_fn = { version = "0.8.12", default-features = false, features = ["axum-no-default"] }
wasip3 = { version = "=0.7.0", features = ["http-compat"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
hydrate = [
  "leptos/hydrate",
  "leptos/islands",
  "dep:wasm-bindgen",
]
ssr = [
  "leptos/ssr",
  "leptos/islands",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_wasi",
  "dep:wasip3",
]

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "counter"
tailwind-input-file = "input.css"
assets-dir = "public"
# Rust's WASI stdlib cannot resolve current_exe(), which Leptos hash-manifest
# lookup currently relies on during SSR. Keep split filenames stable for now.
hash-files = false

# == Hydrate (client)
lib-profile-release = "wasm-release"
lib-features = ["hydrate"]

# == SSR
bin-profile-release = "wasm-release"
bin-target-triple = "wasm32-wasip2"
bin-features = ["ssr"]
bin-target-dir = "target/server"
