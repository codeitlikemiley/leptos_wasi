[graph]
all-features = true
targets = ["wasm32-wasip2"]

[advisories]
yanked = "deny"
# Temporary, non-vulnerability exceptions inherited only through Leptos 0.8.
# Review and remove when Leptos replaces the archived macro dependencies.
ignore = [
    "RUSTSEC-2024-0436", # paste, unmaintained
    "RUSTSEC-2026-0173", # proc-macro-error2, unmaintained
    "RUSTSEC-2026-0249", # smartstring, unmaintained (via routefinder)
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    # `smartstring`, pulled by routefinder, is MPL-2.0 licensed.
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# `wasip3 0.7.0` embeds wit-bindgen 0.57.1 while the exported final-WIT
# component bindings are generated by the explicitly pinned 0.59.0 release.
# Keep duplicates visible until those upstream versions converge.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
