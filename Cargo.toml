[package]
name = "leptos-wasi-runtime"
authors = ["Enzo Nocera", "Uriah Galang"]
license = "MIT"
repository = "https://github.com/codeitlikemiley/leptos_wasi"
description = "WASI integrations for the Leptos web framework."
version = "0.4.2"
edition = "2024"
rust-version = "1.93.0"
include = [
    "/benches/**",
    "/src/**",
    "/CHANGELOG.md",
    "/COMPATIBILITY.md",
    "/LICENSE",
    "/MIDDLEWARE.md",
    "/MIGRATION.md",
    "/PERFORMANCE.md",
    "/PRODUCTION.md",
    "/README.md",
    "/SPIN_COMPATIBILITY.md",
]

[lib]
name = "leptos_wasi"

[dependencies]
throw_error = "0.3.1"
hydration_context = "0.3.0"
futures = "0.3.32"
wasi = { version = "0.14.7", optional = true }
wasip3 = { version = "=0.7.0", features = ["http-compat"], optional = true }
leptos = { version = "0.8.20", default-features = false, features = ["nonce", "ssr"] }
leptos_meta = { version = "0.8.6", default-features = false, features = ["ssr"] }
leptos_router = { version = "0.8.14", default-features = false, features = ["ssr"] }
leptos_macro = { version = "0.8.17", default-features = false, features = ["generic"] }
tachys = { version = "0.2.18", default-features = false }
server_fn = { version = "0.8.13", features = ["generic", "axum-no-default"], default-features = false }
any_spawner = { version = "0.3.0", features = ["futures-executor"] }
http = "1.4.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
parking_lot = "0.12.5"
reactive_graph = { version = "0.2.14", default-features = false, features = ["sandboxed-arenas"] }
bytes = "1.11.1"
routefinder = "0.5.4"
mime_guess = "2.0"
thiserror = "2"
async-stream = "0.3.6"
axum-core = "0.5.6"
tracing = { version = "0.1.44", optional = true }

[[bench]]
name = "route_discovery"
harness = false

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
divan = "0.1.21"
tokio = { version = "1.52", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
anyhow = "1.0"
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
# Warn rather than deny: a bare `cargo clippy` then shows contributors exactly
# what CI checks, and the `-D warnings` the Makefile already passes promotes
# every one of these to an error there. Denying here would collapse that split
# and make each clippy release a hard local block for no gain.
pedantic = { level = "warn", priority = -1 }

too_many_lines = "allow"          # 2 hits, both test functions
struct_excessive_bools = "allow"  # 1 hit, a test config struct
module_name_repetitions = "allow" # 0 hits; matches the three tests/ crates

# Zero hits in production code. Denying them costs only the #[expect] on the
# three test modules that legitimately panic, and it matters more here than in
# a typical library: a panic in a WASI component traps the instance - no
# unwind, nothing to catch it, and the host loses the store.
#
# expect_used is deliberately absent. [lints] is package-scoped, and the
# Makefile passes -D warnings, so any level above "allow" would deny
# `.expect("...")` in tests too - where a message-carrying assertion is
# exactly what you want. The three production sites in src/integration.rs
# are a code-review question, not a lint one.
unwrap_used = "deny"
panic = "deny"

# Zero hits across src/ and tests/ today. Free to deny, and each rules out a
# class of accident that matters more than usual in a component that traps
# instead of unwinding: a panic takes the whole instance down.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
exit = "deny"
unwrap_in_result = "deny"
float_cmp_const = "deny"

# src/ carries no #[allow] at all. Denying these keeps it that way: any
# future suppression has to be #[expect] and has to say why.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[features]
default = ["wasip2"]
wasip2 = ["dep:wasi"]
wasip3 = ["dep:wasip3"]
islands-router = ["tachys/islands"]
tracing = ["dep:tracing"]

[package.metadata.docs.rs]
all-features = true
